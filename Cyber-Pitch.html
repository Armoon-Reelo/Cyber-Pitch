<!DOCTYPE html>
<html lang="tr">
<head>

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070709;--panel:rgba(16,18,28,.8);--cyan:#00f0ff;--green:#00ff66;--pink:#ff0055;--yellow:#ffe600;--violet:#b18cff}
html{scroll-behavior:smooth}
body{font-family:'Chakra Petch',sans-serif;background:var(--bg);color:#e2e8f0;min-height:100vh;
 background-image:radial-gradient(circle at 50% 0%,rgba(0,240,255,.09),transparent 65%),repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,102,.025) 3px);}
.mono{font-family:'JetBrains Mono',monospace}
/* --- Kart / Buton --- */
.card{background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(0,240,255,.2);box-shadow:0 8px 32px rgba(0,0,0,.4);
 clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));}
.btn{--c:var(--cyan);background:linear-gradient(135deg,rgba(0,240,255,.14),rgba(0,255,102,.06));border:1px solid var(--c);color:var(--c);
 padding:.5rem 1rem;font-weight:600;font-size:.8rem;letter-spacing:.04em;transition:.18s;cursor:pointer;
 clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));white-space:nowrap}
.btn:hover:not(:disabled){background:var(--c);color:#000;box-shadow:0 0 14px var(--c)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-green{--c:var(--green)}.btn-pink{--c:var(--pink)}.btn-yellow{--c:var(--yellow)}.btn-violet{--c:var(--violet)}
.btn-pink:hover:not(:disabled){color:#fff}
.btn-sm{padding:.2rem .6rem;font-size:.68rem}
.nav-btn.active{background:var(--green);color:#000;box-shadow:0 0 14px var(--green);border-color:var(--green)}
/* --- Segmentli kontrol --- */
.seg{display:flex;border:1px solid rgba(0,240,255,.25);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:.35rem .3rem;font-size:.68rem;background:rgba(10,12,20,.8);color:#94a3b8;border-right:1px solid rgba(0,240,255,.12);transition:.15s}
.seg button:last-child{border-right:0}
.seg button:hover{color:#fff;background:rgba(0,240,255,.12)}
.seg button.active{background:var(--cyan);color:#000;font-weight:700}
/* --- Parçalar --- */
.chip{padding:.15rem .6rem;border:1px solid rgba(148,163,184,.3);border-radius:999px;font-size:.7rem;color:#94a3b8;cursor:pointer;transition:.15s}
.chip:hover{color:#fff;border-color:var(--cyan)}.chip.active{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:700}
.pos-badge{display:inline-block;min-width:2.1rem;text-align:center;padding:.05rem .3rem;border-radius:4px;font-size:.65rem;font-weight:700;color:var(--c);border:1px solid var(--c);background:rgba(0,0,0,.35)}
.tag{display:inline-block;padding:.02rem .4rem;border-radius:4px;font-size:.6rem;font-weight:700;margin-left:.2rem}
.t-pink{color:var(--pink);border:1px solid var(--pink)}.t-yellow{color:var(--yellow);border:1px solid var(--yellow)}
.t-cyan{color:var(--cyan);border:1px solid var(--cyan)}.t-green{color:var(--green);border:1px solid var(--green)}
.t-violet{color:var(--violet);border:1px solid var(--violet);box-shadow:0 0 8px rgba(177,140,255,.5)}
.bar{height:6px;background:#1e293b;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;transition:width .3s}
.glow-c{text-shadow:0 0 8px rgba(0,240,255,.6)}.glow-g{text-shadow:0 0 8px rgba(0,255,102,.6)}.glow-p{text-shadow:0 0 8px rgba(255,0,85,.6)}
.prodigy{animation:pulseV 2.4s infinite}
@keyframes pulseV{50%{box-shadow:0 0 18px rgba(177,140,255,.55)}}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s;z-index:5}
.slot:hover{transform:translate(-50%,-50%) scale(1.12)}
.slot .dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--c);background:#0b1220;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:var(--c);box-shadow:0 0 12px -2px var(--c)}
.slot .nm{margin-top:2px;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.1);padding:0 .3rem;border-radius:4px;font-size:.62rem;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.empty .dot{border-style:dashed;color:#64748b}
.slot.bad .dot{border-color:var(--pink);color:var(--pink)}
.row-hover:hover{background:rgba(30,41,59,.55)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:rgba(10,10,15,.5)}
::-webkit-scrollbar-thumb{background:rgba(0,240,255,.3);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--cyan)}
#modalRoot{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:1rem}
#modalRoot.open{display:flex}
#modalBody{max-height:90vh;overflow-y:auto;width:100%;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
#toasts{position:fixed;right:1rem;bottom:1rem;z-index:70;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.6rem 1rem;background:#0b1220;border:1px solid var(--cyan);color:#e2e8f0;font-size:.8rem;max-width:320px;animation:pop .2s;box-shadow:0 0 16px rgba(0,240,255,.25)}
.toast.err{border-color:var(--pink)}.toast.ok{border-color:var(--green)}
canvas{background:radial-gradient(circle at center,#0d2818,#05100a);border:2px solid var(--green);box-shadow:inset 0 0 20px rgba(0,255,102,.2),0 0 15px rgba(0,255,102,.25)}
select,input[type=text]{background:#0b1220;border:1px solid rgba(0,240,255,.4);color:#a5f3fc;padding:.3rem .6rem;border-radius:4px;font-size:.8rem;outline:none}

<script>
'use strict';
/* ==========================================================================
   MİMARİ NOTU
   --------------------------------------------------------------------------
   0  YAPILANDIRMA        sabitler
   1  YARDIMCILAR         rastgele, format, kaçış fonksiyonları
   2  VERİ                formasyonlar, taktikler, isimler, yorum metinleri
   3  DURUM / KAYIT       tek global oyun durumu (G) + localStorage

   8  TRANSFER & KİRALAMA pazar üretimi, satın alma, kiralama, tesisler
   9  UI ÇEKİRDEĞİ        ekran kaydı (Screens), eylemler (Actions), modal, toast
   10 2D SAHA             canvas animasyonu
   11 EKRANLAR            Kadro, Taktik, Maç, Pazar, Lig, Kulüp
   12 BAŞLATMA
   YENİ EKRAN EKLEMEK İÇİN: Screens.register({id,icon,label,render(el)}) yeterli.
   Butonlar data-action="isim" ile bağlanır, işleyici Actions.isim = (arg, el) => {...}
   ========================================================================== */

/* ==========================================================================
   0. YAPILANDIRMA
   ========================================================================== */
const CONFIG = {

/* ==========================================================================
   1. YARDIMCILAR
   ========================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const uid = () => 'p_' + Math.random().toString(36).slice(2, 10);
const money = n => '₡' + Math.round(n).toLocaleString('tr-TR');
const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shortName = n => n.split(' ').slice(1).join(' ') || n;
const minLabel = m => m > 90 ? '90+' + (m - 90) : String(m);
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wpick(arr, fn) {
  let tot = 0; const ws = arr.map(x => { const w = Math.max(0, fn(x)); tot += w; return w; });
  if (tot <= 0) return null;
  let r = Math.random() * tot;
  for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}

/* ==========================================================================
   2. VERİ (formasyon, taktik, isim, yorum metinleri)
   ========================================================================== */

// x: yanal %, y: derinlik % (90 = kendi kalesi, 15 = rakip kale önü)

// Taktik değerleri: mentality 0-4 (2 nötr), pressing 0-3 (1 nötr), diğerleri 0-2 (1 nötr)

  tikitaka:  { name: 'Tiki-Taka', icon: '🧠', desc: 'Kısa paslar, yüksek hat, topa hakimiyet.', t: { mentality: 3, pressing: 2, tempo: 1, passing: 0, width: 0, line: 2 } },

  parkbus:   { name: 'Otobüs Park', icon: '🚌', desc: 'Tam savunma. Düşük enerji harcar, az gol atar.', t: { mentality: 0, pressing: 0, tempo: 0, passing: 2, width: 0, line: 0 } },

const NAME_FIRST = ['Kairo','Axel','Ryu','Zane','Nova','Kaelen','Vektor','Jett','Blaze','Nyx','Orion','Draven','Lyra','Talon','Siren','Titan','Zenith','Viper','Echo','Phantom','Glitch','Rex','Mako','Cyra','Dex','Hiro','Juno','Kade','Lux','Neo','Onyx','Pixel','Quill','Raze','Sable','Tron','Umbra','Volt','Wraith','Xeno','Yuki','Zed','Ash','Bolt','Cinder','Dax','Ember','Flux'];

// Maç yorumları ({p}: oyuncu, {t}: takım, {k}: kaleci, {a}: asist)
const TEXT = {

  goal: ['⚽ GOOOL! {p} ({t}) plazma vuruşuyla ağları buluyor!', '⚽ GOL! {p} soğukkanlılıkla tamamlıyor!', '⚽ GOOOL! {p} köşeye bırakıyor, {t} öne geçiyor!', '⚽ GOL! {p} defansı aşıp fileleri havalandırıyor!'],

/* ==========================================================================
   3. DURUM / KAYIT
   ========================================================================== */
let G = null;                       // tüm oyun durumu
const usedNames = new Set();
const Store = {
  save() { try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(G)); } catch (e) { /* depolama yok */ } },
  load() { try { const raw = localStorage.getItem(CONFIG.SAVE_KEY); if (!raw) return null; const d = JSON.parse(raw); return d.version === CONFIG.SAVE_VERSION ? d : null; } catch (e) { return null; } },
  clear() { try { localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) { /* yok */ } }
};

function genName() {
  for (let i = 0; i < 200; i++) { const n = pick(NAME_FIRST) + ' ' + pick(NAME_LAST); if (!usedNames.has(n)) { usedNames.add(n); return n; } }

// --- İlk 11 yönetimi ---

const ROLE_FORMULA = {

  def:  { DEF: { def: .55, phy: .2, pac: .15, pas: .1 }, MID: { def: .45, phy: .25, pas: .15, pac: .15 }, FWD: { def: .5, phy: .3, pac: .2 }, GK: { def: 1 } },
  ctrl: { MID: { pas: .4, dri: .35, def: .15, phy: .1 }, FWD: { pas: .4, dri: .4, pac: .2 }, DEF: { pas: .5, dri: .3, def: .2 }, GK: { pas: 1 } }

// T: bizim taktiğimiz, O: rakibin taktiği. Taktikler arası taş-kağıt-makas etkileşimleri burada.
function tacticMods(T, O, pace) {
  const m = { att: 0, def: 0, ctrl: 0, shot: 1, drain: 1, foul: 1 };
  const ment = T.mentality - 2, press = T.pressing - 1, line = T.line - 1;
  m.att += ment * 3; m.def -= ment * 3;
  m.ctrl += (T.passing === 0 ? 2 : T.passing === 2 ? -2.5 : 0) + line * 1.5 + press * 1.5 + (T.width === 0 ? 1 : 0);
  m.def += -line * 2 + (T.width === 0 ? 1 : T.width === 2 ? -1 : 0) + (T.pressing === 3 ? -1 : 0);
  if (T.width === 2) m.att += 1.5;
  m.shot = [0.9, 1, 1.12][T.tempo] * (T.passing === 2 ? 1.06 : T.passing === 0 ? 0.97 : 1);
  m.drain = [0.9, 1, 1.15][T.tempo] * [0.8, 1, 1.25, 1.5][T.pressing] * (line === 1 ? 1.03 : 1);
  m.foul = [0.8, 1, 1.2, 1.4][T.pressing];

  if (O.pressing >= 2 && T.passing === 2) m.att += 2.5;                   // uzun top presi atlar

  if (O.line === 2 && T.tempo === 2 && ment <= 0) m.att += 2;             // kontra
  if (O.line === 0 && T.passing === 0 && T.width !== 2) m.att -= 2.5;     // derin blok kısa pasa kapalı

    rounds.push(rd); arr.splice(1, 0, arr.pop());

}
const emptyStats = () => ({ p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, form: [] });
function standings() {

}

}
function nextInfo() {

function prepareAI(team) {                            // yapay zeka takımı: bazen formasyon/taktik değiştirir, kadroyu enerjiye göre seçer

// Kullanıcının maçı bitince çağrılır: haftanın diğer maçları, gelir, toparlanma, gelişim
function completeUserMatch(M) {

  const res = { md: G.md, h: fix.h, a: fix.a, hs: M.home.score, as: M.away.score, scorers: { home: M.home.scorers, away: M.away.scorers } };
  recordResult(res);

  for (const f of G.fixtures[G.md]) {

  }

  const income = us > os ? CONFIG.PRIZE.win : us === os ? CONFIG.PRIZE.draw : CONFIG.PRIZE.loss;
  G.budget += income;
  // Haftalık süreç: enerji, sakatlık, ceza, kiralık süresi, gelişim
  for (const t of G.teams) {
    const rec = t.isUser ? CONFIG.BASE_RECOVERY + G.facilities.medical * 4 : CONFIG.BASE_RECOVERY + 2;
    const lvl = t.isUser ? G.facilities.training : 1;
    for (const p of [...t.squad]) {

      p.energy = Math.min(100, p.energy + rec);
      if (p.injury > 0) { p.injury--; if (t.isUser && p.injury === 0) notes.push(`${p.name} sakatlıktan döndü.`); }
      if (p.ban > 0) p.ban--;

      if (t.isUser && p.loan) { p.loan.left--; if (p.loan.left <= 0 && !p.loan.opt) { t.squad = t.squad.filter(x => x !== p); notes.push(`🔙 ${p.name} kiralık süresi bitti, kulübüne döndü.`); } }
    }

function genMarketPlayer() {
  const sc = G.facilities.scouting;
  const r = Math.random(), wStar = .10 + sc * .012, wPro = .20 + sc * .025;
  let type = 'solid';
  if (r < wStar) type = 'star'; else if (r < wStar + wPro) type = 'prodigy'; else if (r < wStar + wPro + .12) type = 'veteran'; else if (r < wStar + wPro + .26) type = 'free';
  const pos = wpick(['GK', 'DEF', 'MID', 'FWD'], x => ({ GK: .1, DEF: .3, MID: .32, FWD: .28 }[x]));
  let ovr, age, pot;
  if (type === 'star') { ovr = rint(85, 92); age = rint(25, 31); pot = ovr + rint(0, 4); }
  else if (type === 'prodigy') { age = rint(16, 20); pot = rint(sc >= 3 ? 91 : 89, 99); ovr = clamp(rint(52, pot - 12), 52, 80); }
  else if (type === 'veteran') { ovr = rint(78, 86); age = rint(32, 36); pot = ovr; }
  else if (type === 'free') { ovr = rint(60, 76); age = rint(22, 33); pot = ovr + rint(0, age < 25 ? 8 : 3); }
  else { ovr = rint(70, 84); age = rint(23, 30); pot = ovr + rint(0, 6); }
  const p = createPlayer({ pos, ovr, pot: Math.min(99, pot), age });
  p.mkt = type; p.fee = type === 'free' ? Math.round(p.value * 0.12 / 10000) * 10000 : p.value;
  return p;
}
function refreshMarket(full) {
  const size = CONFIG.MARKET_SIZE + G.facilities.scouting * 2;
  G.market = full ? [] : G.market.filter(() => chance(0.78));
  while (G.market.length < size) G.market.push(genMarketPlayer());
}
const loanFee = (p, matches) => Math.round(p.value * CONFIG.LOAN_FEE_PER_MATCH * matches / 10000) * 10000;
function acquire(p, cost, loan) {
  const u = userTeam();
  G.budget -= cost; G.market = G.market.filter(x => x.id !== p.id);
  delete p.mkt; delete p.fee; p.loan = loan; p.energy = 100;
  u.squad.push(p);
  const placed = startPlayer(u, p.id);
  return placed;
}

const Pitch2D = {
  canvas: null, ctx: null, view: null, ball: { x: .5, y: .5 }, target: { x: .5, y: .5 }, poss: 'home', flash: 0, flashTxt: '', raf: 0,
  attach(canvas) {
    this.canvas = canvas; this.ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
    cancelAnimationFrame(this.raf); if (this.ctx) this.raf = requestAnimationFrame(t => this.loop(t));
  },
  setView(home, away) { this.view = { home, away }; },
  setTarget(phase) {
    this.poss = phase.side; const dir = phase.side === 'home' ? 1 : -1;
    const base = { build: .5 + dir * rnd(0, .12), attack: .5 + dir * rnd(.14, .3), shot: .5 + dir * .43, goal: .5 }[phase.kind] ?? .5;
    this.target = { x: base, y: rnd(.22, .78) };
  },
  boom(txt) { this.flash = 1; this.flashTxt = txt; },
  loop(t) {
    if (!this.canvas || !document.body.contains(this.canvas)) return;
    this.ball.x += (this.target.x - this.ball.x) * .06; this.ball.y += (this.target.y - this.ball.y) * .06;
    this.draw(t); this.raf = requestAnimationFrame(tt => this.loop(tt));
  },
  playerPos(side, s, i, t) {
    const depth = (95 - s.y) / 79, roleF = { GK: .04, DEF: .3, MID: .5, FWD: .65 }[s.pos], dir = side.isHome ? 1 : -1;
    let x = side.isHome ? .045 + depth * .55 : 1 - (.045 + depth * .55);
    x += (this.ball.x - .5) * .34 * roleF + (this.poss === (side.isHome ? 'home' : 'away') ? dir * .05 * roleF : -dir * .03 * roleF);
    let y = side.isHome ? s.x / 100 : 1 - s.x / 100;
    const dx = this.ball.x - x, dy = this.ball.y - y, d = Math.hypot(dx, dy);
    if (s.pos !== 'GK' && d < .22) { const k = .18 * (1 - d / .22); x += dx * k; y += dy * k; }
    x += Math.sin(t / 700 + i * 1.7) * .006; y += Math.cos(t / 900 + i * 2.3) * .008;
    return { x: clamp(x, .02, .98), y: clamp(y, .04, .96) };
  },
  draw(t) {
    const c = this.ctx, W = 720, H = 460, m = 16, fw = W - 2 * m, fh = H - 2 * m;
    const X = n => m + n * fw, Y = n => m + n * fh;
    c.clearRect(0, 0, W, H);
    for (let i = 0; i < 12; i++) { c.fillStyle = i % 2 ? 'rgba(0,255,102,.045)' : 'rgba(0,0,0,.12)'; c.fillRect(m + i * fw / 12, m, fw / 12, fh); }
    c.strokeStyle = 'rgba(0,255,102,.5)'; c.lineWidth = 2; c.strokeRect(m, m, fw, fh);
    c.beginPath(); c.moveTo(X(.5), m); c.lineTo(X(.5), m + fh); c.stroke();
    c.beginPath(); c.arc(X(.5), Y(.5), 48, 0, Math.PI * 2); c.stroke();
    c.strokeRect(m, Y(.25), fw * .15, fh * .5); c.strokeRect(X(.85), Y(.25), fw * .15, fh * .5);
    c.strokeRect(m, Y(.38), fw * .06, fh * .24); c.strokeRect(X(.94), Y(.38), fw * .06, fh * .24);
    c.fillStyle = 'rgba(0,255,102,.5)'; c.fillRect(m - 5, Y(.45), 5, fh * .1); c.fillRect(m + fw, Y(.45), 5, fh * .1);
    if (this.view) {
      let i = 0;
      for (const side of [this.view.home, this.view.away]) {
        const col = side.isUser ? '#00f0ff' : '#ff0055';
        for (const s of side.pitch) {
          const q = this.playerPos(side, s, i++, t), px = X(q.x), py = Y(q.y);
          c.fillStyle = s.pos === 'GK' ? '#ffe600' : col; c.shadowColor = c.fillStyle; c.shadowBlur = 8;
          c.beginPath(); c.arc(px, py, 8, 0, Math.PI * 2); c.fill(); c.shadowBlur = 0;
          c.fillStyle = '#000'; c.font = 'bold 8px Chakra Petch'; c.textAlign = 'center'; c.fillText(Math.round(perfOvr(s.p)), px, py + 3);
          c.fillStyle = 'rgba(255,255,255,.75)'; c.font = '9px Chakra Petch'; c.fillText(shortName(s.p.name).slice(0, 8), px, py - 12);
          if (side.yc && side.yc[s.p.id]) { c.fillStyle = '#ffe600'; c.fillRect(px + 7, py - 9, 4, 6); }
        }
      }
    }
    c.fillStyle = '#fff'; c.shadowColor = '#ffe600'; c.shadowBlur = 12;
    c.beginPath(); c.arc(X(this.ball.x), Y(this.ball.y), 5, 0, Math.PI * 2); c.fill(); c.shadowBlur = 0;
    if (this.flash > 0) {
      c.globalAlpha = this.flash; c.fillStyle = '#ffe600'; c.font = 'bold 54px Chakra Petch'; c.textAlign = 'center';
      c.fillText(this.flashTxt, W / 2, H / 2 + 18); c.globalAlpha = 1; this.flash -= .012;
    }
  }
};

function recommendPreset(info) {
  const u = cloneTeam(userTeam()); validateLineup(u); const o = cloneTeam(info.opp); autoLineup(o);
  const os = createSide(o, !info.home); os.tactic = { ...TACTIC_PRESETS[o.style].t };
  let best = null, bs = -1e9;
  for (const [k, v] of Object.entries(TACTIC_PRESETS)) {
    const us = createSide(u, info.home); us.tactic = { ...v.t };
    const a = computeStrength(us, os), b = computeStrength(os, us);
    const sc = (a.att - b.def) + 0.7 * (a.def - b.att) + 0.5 * (a.ctrl - b.ctrl) - (v.t.pressing >= 3 ? 1.2 : 0);
    if (sc > bs) { bs = sc; best = v; }
  }
  return best.icon + ' ' + best.name;
}

const MatchUI = {
  M: null, timer: null, speed: 1, paused: false, drawerTab: 'tactics', subOut: null, lastReport: null,
  isLive() { return !!(this.M && !this.M.finished); },
  stop() { clearInterval(this.timer); this.timer = null; },
  start() {
    if (this.isLive()) return;

    const info = nextInfo(); if (!info) return;
    const u = userTeam(); validateLineup(u);
    if (u.lineup.some(id => !id)) return Toast.show('Kadro eksik: ilk 11 tamamlanamadı.', 'err');
    prepareAI(info.opp);
    const ht = info.home ? u : info.opp, at = info.home ? info.opp : u;
    this.M = createMatch(ht, at, { onEvent: ev => this.onEvent(ev) });
    this.subOut = null; this.paused = false;
    Pitch2D.setView(this.M.home, this.M.away);

  },
  schedule() { this.stop(); if (!this.paused && this.isLive()) this.timer = setInterval(() => this.tick(), [420, 210, 90][this.speed]); },
  tick() {

  skip() {

  },
  onEvent(ev) {

  },
  finish() {

   ${opp ? card(`<div class="flex flex-wrap justify-between items-center gap-2"><div><div class="text-xs text-slate-400">HAFTA ${G.md + 1} · SIRADAKİ MAÇ</div><div class="text-lg font-bold">${esc(u.name)} <span class="text-slate-500">vs</span> ${esc(opp.name)}</div></div><button class="btn btn-green" data-action="goto" data-arg="match">MAÇ MERKEZİNE GİT</button></div>`, 'mb-4') : ''}
   <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-3 mb-4">${T.map(([t, i, l, h]) => `<button class="card p-4 text-left row-hover" data-action="goto" data-arg="${t}"><div class="text-2xl">${i}</div><div class="font-bold text-cyan-400">${l}</div><div class="text-[11px] text-slate-400">${esc(h)}</div></button>`).join('')}</div>
   ${card(`<h3 class="font-bold text-cyan-400 mb-2">📱 SON GELİŞMELER</h3>${e.social.slice(0, 3).map(x => `<div class="text-xs border-b border-slate-800 py-1"><b class="text-cyan-300">${esc(x.w)}</b> ${esc(x.t)}</div>`).join('')}`)}`;
});
const ORDER = ['home', 'squad', 'tactics', 'match', 'market', 'league', 'club', 'mgmt', 'editor'];
Screens.list.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
})();

/* ==========================================================================
   12. OLAY DAĞITIMI & BAŞLATMA
   ========================================================================== */
document.addEventListener('click', e => {
  if (e.target.id === 'modalRoot') return Modal.close();
  const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
  const fn = Actions[el.dataset.action]; if (fn) fn(el.dataset.arg, el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  const fn = Actions[el.dataset.change]; if (fn) fn(el.type === 'checkbox' ? el.checked : el.value, el);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]'); if (!el) return;
  const fn = Actions[el.dataset.input]; if (fn) fn(el.value, el);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Modal.isOpen()) Modal.close(); });

function boot() { loadOrInit(); UI.buildShell(); UI.go('home'); }
if (typeof window !== 'undefined') window.addEventListener('load', boot);
</script>
</body>
</html>
